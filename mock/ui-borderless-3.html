<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无限画布 · 无边框三方案</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 720px at 28% -10%, #2c2c34, transparent 62%),
      radial-gradient(900px 600px at 92% 108%, #232330, transparent 60%),
      #17171b;
    color:#e9e7e2;
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- 页面外壳 ---------- */
  .bar{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:18px;
    padding:12px 22px; background:#0b0b0e; border-bottom:1px solid #1b1b20;
  }
  .bar-l{display:flex; align-items:baseline; gap:12px; min-width:0;}
  .bar-l b{font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap;}
  .bar-l span{font-size:11px; color:#6f6b64; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-r{display:flex; align-items:center; gap:9px; flex:none;}
  .seg{display:flex; align-items:center; gap:2px; padding:3px; background:#141418; border-radius:9px; border:1px solid #232329;}
  .seg button{
    border:0; background:transparent; color:#9c9ca6; font:inherit; font-size:11.5px;
    padding:5px 11px; border-radius:6px; cursor:pointer; white-space:nowrap;
    transition:background .13s,color .13s;
  }
  .seg button:hover{color:#f0f0f3; background:#1e1e24;}
  .seg button.on{background:#2a2a33; color:#fff;}
  .seg-lb{font-size:10.5px; color:#5a5a63; letter-spacing:.06em; margin-right:2px; padding-left:4px;}

  main{flex:1; min-height:0; overflow:auto; padding:16px 22px 24px;
    display:flex; flex-direction:column; justify-content:safe center;}
  .deck{display:flex; gap:16px; align-items:flex-start; width:100%;}
  .deck.one{display:grid; grid-template-columns:minmax(0,1fr) 312px; gap:18px; align-items:start; width:100%;}

  .col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:8px;}
  .col-hd{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .col-hd h2{margin:0; font-size:12.5px; font-weight:600; letter-spacing:.01em;
    display:flex; align-items:center; gap:8px;}
  .col-hd .num{
    display:grid; place-items:center; width:19px; height:19px; flex:none;
    border-radius:5px; background:#1c1c21; border:1px solid #2b2b33;
    font-size:10.5px; color:#9c9ca6; font-weight:600;
  }
  .col-hd .tag{font-size:10.5px; color:#5a5a63; letter-spacing:.02em; white-space:nowrap;}
  .col-hd .exp{margin-left:auto; font-size:10.5px; color:#6a8bff; opacity:0; transition:opacity .15s;}
  .col-hd:hover .exp{opacity:1;}

  /* 预览台面：模拟桌面，让窗口圆角与投影可见 */
  .shot{position:relative; width:100%; cursor:zoom-in;}
  .deck.one .shot{cursor:default;}
  .shot > .app{
    position:absolute; left:0; top:0; width:1280px; height:760px; transform-origin:0 0;
  }
  .col-note{margin:0; font-size:11px; line-height:1.6; color:#6f6b64;}
  .col-note b{color:#9c9ca6; font-weight:500;}

  /* 并排模式下的差异对照表 */
  .cmp{width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:16px;}
  .cmp section{background:#0e0e11; border:1px solid #1f1f26; border-radius:10px; padding:13px 15px 14px;}
  .cmp h4{margin:0 0 9px; font-size:11.5px; font-weight:600; color:#dcdae0; display:flex; gap:7px;}
  .cmp h4 i{font-style:normal; color:#6a8bff;}
  .cmp dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:11px; line-height:1.5;}
  .cmp dt{color:#5f5b55; white-space:nowrap;}
  .cmp dd{margin:0; color:#a8a49c;}
  .cmp .cost{grid-column:1/-1; margin-top:8px; padding-top:8px; border-top:1px solid #1b1b21;
    font-size:10.5px; line-height:1.6; color:#6f6b64;}
  .cmp .cost b{color:#9c9ca6; font-weight:500;}

  .side{
    background:#0e0e11; border:1px solid #1f1f26; border-radius:12px; padding:16px;
    display:flex; flex-direction:column; gap:14px; height:max-content;
    max-height:calc(100vh - 120px); overflow-y:auto; position:sticky; top:0;
  }
  .side h3{margin:0; font-size:12px; font-weight:600; color:#f0f0f3;}
  .side .lead{margin:0; font-size:11.5px; line-height:1.7; color:#8f8c85;}
  .side .ref{
    display:flex; align-items:center; gap:7px; padding:8px 10px; border-radius:8px;
    background:#15151a; border:1px solid #22222a; font-size:10.5px; color:#8f8c85;
  }
  .side .ref b{color:#c9c5bd; font-weight:500;}
  .side .ref em{font-style:normal; margin-left:auto; color:#6a8bff; font-size:10px;}
  .side ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .side li{display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:11px; line-height:1.55;}
  .side li i{font-style:normal; color:#6f6b64; grid-column:1;}
  .side li em{font-style:normal; color:#c9c5bd; grid-column:2; text-align:right; white-space:nowrap;}
  .side .hint{font-size:10.5px; line-height:1.65; color:#5a5a63;
    border-top:1px solid #1c1c21; padding-top:12px;}
  @media (max-width:1100px){
    .deck{flex-direction:column;}
    .deck.one{grid-template-columns:1fr;}
  }

  /* ================================================================
     软件界面 —— 工艺层固定在方案 A：8px 卡片 / 无投影 / 1px 细线 / 透明玻璃输入条
     只在「边缘关系」上做三个变体
     ================================================================ */
  .app{
    --paper:#0b0b0d; --panel:#131316; --card:#16161a; --raise:#1c1c21;
    --hover:#232329; --line:#242429; --line2:#2b2b33; --line3:#3a3a44;
    --edge:#4a4a55;
    --ink:#f0f0f3; --inkStrong:#fafafd; --ink2:#c4c4cc; --ink3:#9c9ca6;
    --muted:#85858f; --faint:#6a6a74; --faint2:#5a5a63;
    --glass:rgba(22,22,26,.92); --dot:#242429;
    --ok-fg:#63d3a8; --ok-bg:#0f2220; --ok-line:#204a41;
    --err-fg:#f2797d; --err-bg:#1a1418; --err-line:#3d242b;
    --accent:#4d6bfe; --accent-soft:rgba(77,107,254,.16);
    --accent-line:rgba(77,107,254,.34); --accent-wash:rgba(77,107,254,.10);

    /* 工艺（=A）：圆角、无投影、描边 */
    --r-card:8px; --r-btn:6px; --r-tool:10px; --r-pop:10px; --r-comp:12px;
    --sh-card:0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.045);
    --sh-comp:0 0 0 1px var(--line2);
    --sh-tool:0 0 0 1px var(--line);
    --sh-pop:0 0 0 1px var(--line), 0 14px 30px -20px rgba(0,0,0,.8);
    --lift:0px;
    --lab-ls:.13em; --lab-tt:uppercase; --lab-fw:500;

    /* 边缘关系（由 data-b 覆盖） */
    --r-win:12px;
    --win-ring:none;
    --win-shadow:0 34px 80px -30px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.5);
    --rail-l:0px; --rail-t:32px; --rail-b:0px; --rail-w:248px;
    --rail-bd:0; --top-bd:0; --winbar-bd:0;
    --top-l:248px; --top-t:32px; --top-r:0px; --top-h:52px;
    --stage-l:248px; --stage-t:84px;
    --stage-pad:0px;
    --tools-l:14px; --tools-t:16px;
    --qpop-t:6px;

    position:relative; overflow:hidden; border-radius:var(--r-win);
    background:var(--paper); color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums;
    user-select:none;
    box-shadow:var(--win-ring), var(--win-shadow);
  }
  .app[data-th="warm"]{
    --paper:#0d0e10; --panel:#141619; --card:#1a1d21; --raise:#1f2329;
    --hover:#242830; --line:#262b32; --line2:#2e333a; --line3:#3a4149; --edge:#4a5058;
    --ink:#e9e7e2; --inkStrong:#f3efe8; --ink2:#c9c5bd; --ink3:#a8a49c;
    --muted:#8f8c85; --faint:#6f6b64; --faint2:#5f5c56;
    --glass:rgba(26,29,33,.92); --dot:#2a2e34;
    --ok-fg:#8fc9a8; --ok-bg:#16211c; --ok-line:#2f4a3c;
    --err-fg:#e0704f; --err-bg:#1d1614; --err-line:#3d2a23;
    --accent:#e0603a; --accent-soft:rgba(224,96,58,.16);
    --accent-line:rgba(224,96,58,.32); --accent-wash:rgba(224,96,58,.09);
    --win-shadow:0 34px 80px -30px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.5);
  }
  .app[data-th="light"]{
    --paper:#f7f6f3; --panel:#fdfcfa; --card:#ffffff; --raise:#f3f1ec;
    --hover:#eae7e0; --line:#e7e4dd; --line2:#d9d5cc; --line3:#c7c2b7; --edge:#aca69a;
    --ink:#1c1c22; --inkStrong:#0d0d12; --ink2:#3c3c45; --ink3:#55555f;
    --muted:#72727c; --faint:#8a8a94; --faint2:#a2a2ab;
    --glass:rgba(253,252,250,.95); --dot:#ddd8cf;
    --ok-fg:#0f6b48; --ok-bg:#eaf6ef; --ok-line:#bfe0cb;
    --err-fg:#c03a48; --err-bg:#fdf4f5; --err-line:#f0d2d7;
    --accent:#4d6bfe; --accent-soft:rgba(77,107,254,.12);
    --accent-line:rgba(77,107,254,.30); --accent-wash:rgba(77,107,254,.09);
    --win-shadow:0 30px 70px -32px rgba(58,48,36,.55), 0 2px 8px rgba(58,48,36,.12);
  }

  /* ---------- 变体 E · 无缝：三块同色连成一体，零分割线 ---------- */
  .app[data-b="e"]{
    --r-win:12px;
    --win-ring:inset 0 1px 0 rgba(255,255,255,.07);
    --rail-bd:0; --top-bd:0; --winbar-bd:0;
  }
  .app[data-b="e"] .winbar{background:var(--panel);}
  .app[data-b="e"] .top{background:var(--panel);}
  .app[data-b="e"] .rail{background:var(--panel);}

  /* ---------- 变体 F · 浮岛：画布铺满，chrome 离边悬浮 ---------- */
  .app[data-b="f"]{
    --r-win:14px;
    --win-ring:none;
    --rail-l:12px; --rail-t:12px; --rail-b:12px; --rail-w:232px;
    --rail-bd:0; --top-bd:0;
    --top-l:256px; --top-t:12px; --top-r:12px; --top-h:48px;
    --stage-l:0px; --stage-t:0px;
    --stage-pad:256px;
    --tools-l:14px; --tools-t:76px;
    --qpop-t:80px;
  }
  .app[data-b="f"] .winbar{display:none;}
  .app[data-b="f"] .rail{
    border-radius:14px;
    box-shadow:0 16px 40px -20px rgba(0,0,0,.95), 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .app[data-b="f"] .top{
    border-radius:12px; background:var(--glass); backdrop-filter:blur(12px);
    box-shadow:0 16px 40px -22px rgba(0,0,0,.9), 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.055);
    padding-right:8px;
  }
  .app[data-b="f"] .composer{left:50%;}
  .app[data-b="f"] .zoom{right:26px; bottom:132px;}
  .app[data-b="f"] .tb-title{display:inline-flex;}
  .app[data-b="f"] .winmini{display:flex;}

  /* ---------- 变体 G · 玻璃：面板是磨砂片，画布透出来 ---------- */
  .app[data-b="g"]{
    --r-win:12px;
    --win-ring:inset 0 0 0 1px rgba(255,255,255,.10);
    --rail-bd:0; --top-bd:0; --winbar-bd:0;
    --stage-l:0px; --stage-t:0px;
    --stage-pad:248px;
    --tools-l:14px; --tools-t:76px;
    --qpop-t:80px;
  }
  .app[data-b="g"] .winbar,
  .app[data-b="g"] .rail,
  .app[data-b="g"] .top{
    background:
      linear-gradient(165deg, rgba(255,255,255,.095), rgba(255,255,255,0) 44%),
      color-mix(in srgb, var(--panel) 48%, transparent);
    backdrop-filter:blur(15px) saturate(1.35);
  }
  /* 面板右缘的玻璃切边：比分割线亮，但只有 1px */
  .app[data-b="g"] .rail::after{
    content:""; position:absolute; right:0; top:0; bottom:0; width:1px;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 40%, rgba(255,255,255,.09));
    pointer-events:none;
  }
  /* 画布的环境光：给玻璃一点可透的东西，否则细点阵被模糊后什么都看不出来 */
  .app[data-b="g"] .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(680px 420px at 34% 24%, rgba(255,255,255,.055), transparent 72%),
      radial-gradient(520px 380px at 76% 82%, rgba(255,255,255,.03), transparent 70%);
  }
  .app[data-th="light"][data-b="g"] .winbar,
  .app[data-th="light"][data-b="g"] .rail,
  .app[data-th="light"][data-b="g"] .top{
    background:
      linear-gradient(165deg, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),
      color-mix(in srgb, var(--panel) 58%, transparent);
  }
  .app[data-b="g"] .top{box-shadow:inset 0 -1px 0 rgba(255,255,255,.055);}
  .app[data-b="g"] .winbar{box-shadow:inset 0 -1px 0 rgba(255,255,255,.035);}
  .app[data-th="light"][data-b="g"] .rail::after{
    background:linear-gradient(180deg, rgba(0,0,0,.07), rgba(0,0,0,.02) 40%, rgba(0,0,0,.05));
  }

  .app[data-b="e"] .mono,
  .app[data-b="f"] .mono,
  .app[data-b="g"] .mono{
    font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }

  /* ---------- 标题栏 ---------- */
  .winbar{
    position:absolute; left:0; right:0; top:0; height:32px; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 3px 0 11px; background:var(--panel); color:var(--ink3);
    box-shadow:inset 0 -1px 0 var(--line);
  }
  .app[data-b="e"] .winbar,
  .app[data-b="g"] .winbar,
  .app[data-b="f"] .winbar{box-shadow:none;}
  .wb-brand{display:flex; align-items:center; gap:7px; min-width:0;}
  .wb-logo{width:16px; height:16px; fill:var(--ink); opacity:.9; flex:none;}
  .wb-name{font-size:11.5px; font-weight:600; color:var(--ink2); white-space:nowrap;}
  .wb-sep{font-size:11px; color:var(--faint2);}
  .wb-doc{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wb-btns{display:flex; gap:1px;}
  .wbtn{width:36px; height:26px; display:grid; place-items:center; border:0; background:transparent;
    border-radius:var(--r-btn); color:var(--ink3); cursor:pointer;}
  .wbtn svg{width:10px; height:10px; fill:none; stroke:currentColor; stroke-width:1.1;}
  .wbtn:hover{background:var(--hover); color:var(--inkStrong);}
  .wbtn.close:hover{background:#c2402a; color:#fff;}

  /* 顶栏内的紧凑窗口按钮（仅 F） */
  .winmini{display:none; align-items:center; gap:1px; margin-left:6px;}
  .winmini b{width:26px; height:22px; border-radius:var(--r-btn); display:grid; place-items:center;}
  .winmini b::before{content:""; width:8px; height:1px; background:var(--faint); display:block;}
  .winmini b:nth-child(2)::before{width:7px; height:7px; border:1px solid var(--faint); background:none;}
  .winmini b:nth-child(3)::before{width:8px; height:8px; background:
    linear-gradient(45deg,transparent 44%,var(--faint) 44%,var(--faint) 56%,transparent 56%),
    linear-gradient(-45deg,transparent 44%,var(--faint) 44%,var(--faint) 56%,transparent 56%);}

  .tb-title{display:none; align-items:center; gap:6px; margin-right:10px;
    font-size:11.5px; color:var(--ink2); white-space:nowrap;}
  .tb-title i{font-style:normal; color:var(--faint2);}
  .tb-title span{color:var(--muted);}

  /* ---------- 左栏 ---------- */
  .rail{
    position:absolute; left:var(--rail-l); top:var(--rail-t); bottom:var(--rail-b);
    width:var(--rail-w); z-index:12;
    display:flex; flex-direction:column; gap:14px; padding:14px 10px 12px;
    background:var(--panel);
  }
  .app[data-b="e"] .rail,
  .app[data-b="g"] .rail{border-right:none;}
  .r-top{display:flex; align-items:center; gap:8px; padding:2px 6px 0;}
  .r-mark{width:18px; height:18px; fill:var(--ink); flex:none;}
  .r-ws{font-size:13.5px; font-weight:600; color:var(--ink); letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-search{display:flex; align-items:center; gap:7px; margin:0 2px; padding:7px 9px;
    background:var(--card); border:1px solid var(--line); border-radius:7px;}
  .app[data-b="g"] .r-search{background:rgba(255,255,255,.035);}
  .app[data-th="light"][data-b="g"] .r-search{background:rgba(0,0,0,.028);}
  .r-search svg{width:14px; height:14px; flex:none; fill:none; stroke:var(--faint); stroke-width:1.8;}
  .r-search span{font-size:13px; color:var(--faint2);}
  .r-new{display:flex; align-items:center; gap:8px; margin:0 2px 6px; padding:8px 10px;
    border-radius:6px; color:var(--muted); font-size:13.5px;}
  .r-new svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8;}
  .r-h{font-size:10px; letter-spacing:var(--lab-ls); text-transform:var(--lab-tt);
    font-weight:var(--lab-fw); color:var(--faint); padding:0 10px;}
  .r-nav{display:flex; flex-direction:column; gap:1px;}
  .r-nav div{display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:13px;
    color:var(--ink3); border-radius:6px;}
  .r-nav svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; flex:none;}
  .r-nav b{margin-left:auto; font-size:11px; color:var(--faint); font-weight:500;}
  .r-list{display:flex; flex-direction:column; gap:1px; flex:1; min-height:0;}
  .r-item{display:flex; align-items:center; padding:8px 10px; font-size:13.5px;
    color:var(--ink3); border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-item.on{background:var(--raise); color:var(--ink); font-weight:550;}
  .r-foot{display:flex; align-items:center; gap:7px; padding:10px 8px 0;
    border-top:1px solid var(--line);}
  .app[data-b="e"] .r-foot,
  .app[data-b="g"] .r-foot{border-top-color:transparent;}
  .r-foot span{font-size:12px; color:var(--faint);}
  .r-foot .dot{width:5px; height:5px; border-radius:50%; background:var(--ok-fg); flex:none;}
  .r-foot svg{margin-left:auto; width:14px; height:14px; fill:none; stroke:var(--faint); stroke-width:1.6;}

  /* ---------- 顶栏 ---------- */
  .top{
    position:absolute; left:var(--top-l); right:var(--top-r); top:var(--top-t);
    height:var(--top-h); z-index:11;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 14px 0 16px; background:var(--panel);
    box-shadow:inset 0 -1px 0 var(--line);
  }
  .app[data-b="e"] .top,
  .app[data-b="g"] .top,
  .app[data-b="f"] .top{box-shadow:none;}
  .app[data-b="f"] .top{padding:0 8px 0 14px;}
  .top-l{display:flex; align-items:center; gap:7px; min-width:0;}
  .tag{display:inline-flex; align-items:center; gap:5px; font-size:10px; letter-spacing:.03em;
    padding:2px 7px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); background:var(--card); white-space:nowrap;}
  .tag i{width:5px; height:5px; border-radius:50%; background:var(--faint); display:block;}
  .tag.ok{color:var(--ok-fg); border-color:var(--ok-line); background:var(--ok-bg);}
  .tag.ok i{background:var(--ok-fg); box-shadow:0 0 0 2px rgba(99,211,168,.14);}
  .app[data-th="light"] .tag.ok i{box-shadow:0 0 0 2px rgba(15,107,72,.12);}

    lead: '画布铺满整窗，左栏与顶栏变成半透明磨砂片，画布点阵从面板下透出来。面板右缘只留一道 1px 白色切边，而不是分割线。',
    kv: [['窗口圆角','12 px'],['面板','48% + blur 15'],['分隔','1px 白色切边'],['窗口描边','整圈 1px 玻璃边'],['卡片','8 px · 仅描边']],
    cmp: [['边框处理','1px 玻璃切边'],['面板','贴边 · 透光'],['顶栏','双层 32 + 52'],['窗口','整圈 1px 玻璃边']],
    cost: '面板发雾，文字对比度略降；blur 在低配机上有开销。',
    note: '最有材质感的一套。注意：WebView2 的 backdrop-filter 只能模糊页内内容，透不出桌面壁纸——真 Mica 要另走系统接口。'
  }
};
const ORDER = ['e','f','g'];
let mode = 'e', th = 'dark';

const deck = document.getElementById('deck');
const tpl  = document.getElementById('tpl');

function makeApp(b){
  const node = tpl.content.firstElementChild.cloneNode(true);
  node.dataset.b = b;
  node.dataset.th = th;
  return node;
}

function build(){
  deck.innerHTML = '';
  const oldCmp = document.getElementById('cmp');
  if (oldCmp) oldCmp.remove();
  deck.className = 'deck' + (mode === 'all' ? '' : ' one');
  const list = mode === 'all' ? ORDER : [mode];

  list.forEach(b => {
    const m = META[b];
    const col = document.createElement('section');
    col.className = 'col';

    const hd = document.createElement('div');
    hd.className = 'col-hd';
    hd.innerHTML = `<span class="num">${b.toUpperCase()}</span><h2>${m.name}</h2>
      <span class="tag">${m.tag}</span>
      <span class="exp">${mode === 'all' ? '点击看全尺寸 →' : '← 返回并排'}</span>`;
    hd.onclick = () => { mode = (mode === 'all' ? b : 'all'); syncSeg(); build(); };
    col.appendChild(hd);

    const shot = document.createElement('div');
    shot.className = 'shot';
    shot.appendChild(makeApp(b));
    if (mode === 'all') shot.onclick = () => { mode = b; syncSeg(); build(); };
    col.appendChild(shot);

    if (mode === 'all') {
      const p = document.createElement('p');
      p.className = 'col-note';
      p.innerHTML = m.kv.slice(0, 3).map(([k, v]) => `${k} <b>${v}</b>`).join(' · ');
      col.appendChild(p);
    }
    deck.appendChild(col);

    if (mode !== 'all') {
      const side = document.createElement('aside');
      side.className = 'side';
      side.innerHTML = `<h3>${m.name} · 怎么做的</h3>
        <p class="lead">${m.lead}</p>
        <div class="ref"><b>${m.ref[0]}</b><span>${m.ref[1]}</span><em>${m.ref[2]}</em></div>
        <ul>${m.kv.map(([k, v]) => `<li><i>${k}</i><em>${v}</em></li>`).join('')}</ul>
        <div class="hint">${m.note}</div>`;
      deck.appendChild(side);
    }
  });
  if (mode === 'all') {
    const box = document.createElement('div');
    box.className = 'cmp';
    box.id = 'cmp';
    ORDER.forEach(b => {
      const m = META[b];
      const s = document.createElement('section');
      s.innerHTML = `<h4><i>${b.toUpperCase()}</i>${m.name}
        <span style="margin-left:auto;font-weight:400;color:#5a5a63;font-size:10px">${m.tag}</span></h4>
        <dl>${m.cmp.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        <div class="cost"><b>代价</b> · ${m.cost}</div>`;
      box.appendChild(s);
    });
    deck.parentElement.appendChild(box);
  }
  requestAnimationFrame(fit);
}

function fit(){
  document.querySelectorAll('.shot').forEach(shot => {
    const k = shot.clientWidth / 1280;
    shot.style.height = Math.round(760 * k) + 'px';
    shot.firstElementChild.style.transform = `scale(${k})`;
  });
}

function syncSeg(){
  document.querySelectorAll('#modeSeg button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('#thSeg button').forEach(b =>
    b.classList.toggle('on', b.dataset.th === th));
}

document.getElementById('modeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; syncSeg(); build();
};
document.getElementById('thSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  th = b.dataset.th;
  document.querySelectorAll('.app').forEach(a => a.dataset.th = th);
  syncSeg();
};
window.addEventListener('resize', fit);

syncSeg();
build();
</script>
</body>
</html>
