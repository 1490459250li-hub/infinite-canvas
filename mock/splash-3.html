<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>无限画布 · 启动画面三方案</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; background:#08080a; color:#e9e7e2;
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; display:flex; flex-direction:column;}

  header.bar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px;
    padding:14px 26px; background:rgba(8,8,10,.92); backdrop-filter:blur(14px);
    border-bottom:1px solid #17171c;
  }
  .bar-l b{display:block; font-size:13px; font-weight:600; letter-spacing:-.01em;}
  .bar-l span{font-size:11px; color:#6f6b64;}
  .bar-r{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .seg{display:flex; align-items:center; gap:2px; padding:3px; border-radius:8px;
    background:#111115; border:1px solid #1e1e24;}
  .seg-lb{font-size:10px; color:#5c5c66; padding:0 7px 0 4px; letter-spacing:.08em;}
  .seg button{
    height:26px; padding:0 11px; border:0; border-radius:6px; background:transparent;
    color:#9a9aa4; font:inherit; font-size:11px; cursor:pointer; transition:.14s;
  }
  .seg button:hover{color:#e9e7e2; background:#1a1a20;}
  .seg button.on{background:#242832; color:#eef0f6; box-shadow:inset 0 0 0 1px #333a48;}
  .btn{
    height:32px; padding:0 14px; border-radius:7px; border:1px solid #2a2a33;
    background:#15151a; color:#c9c9d2; font:inherit; font-size:11px; cursor:pointer;
  }
  .btn:hover{border-color:#3b3b48; color:#fff;}

  main{flex:1; padding:20px 26px 30px; display:flex; flex-direction:column;}
  .deck{display:flex; gap:16px; align-items:flex-start;}
  .deck.one{display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:20px; align-items:start;}
  .col{flex:1; min-width:0;}

  .col-hd{display:flex; align-items:baseline; gap:9px; margin-bottom:11px; cursor:pointer;}
  .col-hd .num{
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:10px; font-weight:600;
    color:#6f7fd6; letter-spacing:.1em; padding:2px 6px; border-radius:4px;
    background:rgba(77,107,254,.11); border:1px solid rgba(77,107,254,.22);
  }
  .col-hd h2{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em;}
  .col-hd .tag{font-size:10px; color:#5f5b55;}
  .col-hd .exp{margin-left:auto; font-size:10px; color:#4e4e57;}

  .shot{
    position:relative; width:100%; overflow:hidden; border-radius:14px;
    background:#000; box-shadow:0 0 0 1px #1b1b21, 0 24px 60px -30px #000;
  }
  .shot canvas{display:block; width:100%; height:auto;}

  .col-note{margin:11px 0 0; font-size:11px; line-height:1.65; color:#6f6b64;}
  .col-note b{color:#9c9ca6; font-weight:500;}

  .side{
    background:#0e0e11; border:1px solid #1f1f26; border-radius:12px; padding:16px;
    display:flex; flex-direction:column; gap:13px; height:max-content;
  }
  .side h3{margin:0; font-size:12px; font-weight:600; color:#e9e7e2;}
  .side .lead{margin:0; font-size:11px; line-height:1.7; color:#8a8680;}
  .side ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px;}
  .side li{display:grid; grid-template-columns:78px 1fr; gap:10px; font-size:10.5px;
    padding-bottom:7px; border-bottom:1px solid #17171c;}
  .side li:last-child{border-bottom:0; padding-bottom:0;}
  .side li i{font-style:normal; color:#5f5b55;}
  .side li em{font-style:normal; color:#c9c5bd; text-align:right;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:10px;}
  .side .hint{font-size:10.5px; line-height:1.7; color:#5a5a63;
    border-top:1px solid #1c1c21; padding-top:11px;}
  .side .hint b{color:#b9b5ad; font-weight:500;}

  .cmp{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px;}
  .cmp section{border:1px solid #1b1b21; border-radius:10px; padding:13px 14px; background:#0c0c0f;}
  .cmp h4{margin:0 0 10px; font-size:11px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .cmp h4 i{font-style:normal; font-family:ui-monospace,Consolas,monospace; font-size:9.5px;
    color:#6f7fd6; padding:1px 5px; border-radius:3px; background:rgba(77,107,254,.11);}
  .cmp dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:10px;}
  .cmp dt{color:#5f5b55;}
  .cmp dd{margin:0; color:#a9a5a0; text-align:right;}
  .cmp .cost{margin-top:10px; padding-top:9px; border-top:1px solid #17171c;
    font-size:10px; line-height:1.6; color:#6f6b64;}
  .cmp .cost b{color:#c08a5a; font-weight:500;}

  @media (max-width:1180px){
    .deck{flex-direction:column;}
    .deck.one{grid-template-columns:1fr;}
    .cmp{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-l">
    <b>无限画布 · 启动画面三方案</b>
    <span>同一套粒子点阵内核，三种「出现方式」 —— 参考 Google Antigravity 开场</span>
  </div>
  <div class="bar-r">
    <div class="seg" id="modeSeg">
      <span class="seg-lb">方案</span>
      <button data-mode="s1" class="on">S1</button>
      <button data-mode="s2">S2</button>
      <button data-mode="s3">S3</button>
      <button data-mode="all">并排</button>
    </div>
    <button class="btn" id="replay">↻ 重播</button>
  </div>
</header>

<main><div class="deck" id="deck"></div></main>

<script>
/* ==================================================================
   粒子点阵内核
   · 几何用双纽线（∞）参数方程 —— 纯数学，能一比一移植到 Python/GDI
   · 所有随机量来自固定种子，任何时刻的状态只由 t 决定（可定格截图）
   ================================================================== */
const W = 520, H = 300;
const CX = W/2, CY = 106;          // logo 中心
const AA = 106;                     // 横向半径
const YS = 1.0;                     // 纵横向比例 < 1 会更扁；标准双纽线用 1

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 双纽线：u∈[0,2π) → 曲线上的点 */
function lemniscate(u){
  const s = Math.sin(u), c = Math.cos(u), d = 1 + s*s;
  return [ AA * c / d, AA * s * c / d * YS ];
}

/* 是否落在 ∞ 内部：(x²+y²)² ≤ a²(x²-y²) */
function insideShape(x, y){
  const yy = y / YS;
  const l = x*x + yy*yy;
  return l * l <= AA*AA*(x*x - yy*yy);
}

/* 色带：蓝 → 青 → 绿 → 金 → 橙红（横向归一化位置取色） */
const RAMP = [
  [0.00, 58, 92, 255],
  [0.20, 45, 170, 250],
  [0.38, 45, 216, 208],
  [0.56, 132, 226, 118],
  [0.72, 250, 202, 78],
  [0.88, 255, 128, 78],
  [1.00, 255, 92, 122],
];
function rampAt(x){
  const p = Math.max(0, Math.min(0.999, x));
  for (let i = 0; i < RAMP.length - 1; i++){
    const a = RAMP[i], b = RAMP[i+1];
    if (p >= a[0] && p <= b[0]){
      const k = (p - a[0]) / (b[0] - a[0]);
      return [
        Math.round(a[1] + (b[1]-a[1])*k),
        Math.round(a[2] + (b[2]-a[2])*k),
        Math.round(a[3] + (b[3]-a[3])*k),
      ];
    }
  }
  return [255,255,255];
}

/* 生成点阵：轮廓加密 + 内部实心填充（和参考视频一样是「面」不是「线」） */
const DOTS = [];
(function(){
  const rnd = mulberry32(20261121);
  const STEPS = 720;

  // ① 边缘：沿曲线采样，法向抖出 1.5px 的厚度
  for (let i = 0; i < STEPS; i++){
    const u = i / STEPS * Math.PI * 2;
    const [x, y] = lemniscate(u);
    const [x2, y2] = lemniscate(u + 0.004);
    let nx = -(y2 - y), ny = (x2 - x);
    const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;

    const off = (rnd() * 2 - 1) * 1.6;
    DOTS.push({
      x: CX + x + nx * off, y: CY + y + ny * off,
      r: 0.78 + rnd() * 0.62,
      a: 0.52 + rnd() * 0.38,
      z: rnd(), u, rim: true
    });
  }

  // ② 内部：拒绝采样填满形体，密度越靠内越疏（使边缘自发显得更亮）
  let tries = 0;
  let filled = 0;
  while (filled < 1650 && tries < 150000){
    tries++;
    const x = (rnd() * 2 - 1) * AA;
    const y = (rnd() * 2 - 1) * AA * 0.40;
    if (!insideShape(x, y)) continue;
    // 边缘附近二次加密
    const rr = Math.hypot(x, y) / AA;
    if (rnd() > 0.35 + 0.65 * rr) continue;
    filled++;
    DOTS.push({
      x: CX + x, y: CY + y,
      r: 0.5 + rnd() * 0.28,
      a: 0.18 + rnd() * 0.20,
      z: rnd(), u: -2
    });
  }

  // ③ 外围浮尘
  for (let i = 0; i < 190; i++){
    const ang = rnd() * Math.PI * 2;
    const rad = 130 + rnd() * 210;
    DOTS.push({
      x: CX + Math.cos(ang) * rad,
      y: CY + Math.sin(ang) * rad * 0.62,
      r: 0.5 + rnd() * 0.7,
      a: 0.10 + rnd() * 0.24,
      z: rnd(), u: -1, dust: true
    });
  }
})();

/* 坐标归一化（用于取色） */
const XMIN = -AA, XMAX = AA;
const normX = x => (x - (CX + XMIN)) / (XMAX - XMIN);

/* 取色：色带色 → 混白。
   k 越大越接近白 —— 参考视频里点本身是浅色微粒，
   饱和度来自背后的体积光，而不是点自己。 */
function tintAt(v, k, a){
  const [r, g, b] = rampAt(clamp01(v));
  const R = Math.round(r + (255 - r) * k);
  const G = Math.round(g + (255 - g) * k);
  const B = Math.round(b + (255 - b) * k);
  return `rgba(${R},${G},${B},${a})`;
}
function tint(x, k, a){ return tintAt(normX(x), k, a); }

/* 预渲染光晕（S1 用） */
const GLOW = (function(){
  const raw = document.createElement('canvas');
  raw.width = W * 2; raw.height = H * 2;
  const c = raw.getContext('2d');
  c.scale(2,2);
  DOTS.forEach(d => {
    if (d.dust) return;
    const [r,g,b] = rampAt(normX(d.x));
    c.fillStyle = `rgba(${r},${g},${b},${d.rim ? .30 : .20})`;
    c.beginPath(); c.arc(d.x, d.y, d.rim ? 6.5 : 8, 0, 6.2832); c.fill();
  });
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.filter = 'blur(17px)';
  o.drawImage(raw, 0, 0, W, H);
  return out;
})();

/* 缓动 */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOutQuart = v => 1 - Math.pow(1 - v, 4);
const easeOutCubic = v => 1 - Math.pow(1 - v, 3);
const easeInOut = v => v < .5 ? 2*v*v : 1 - Math.pow(-2*v+2, 2)/2;

/* ==================================================================
   S1 · 点阵聚形 —— 把参考视频的做法搬过来
   ================================================================== */
const S1 = {
  CONV: 1.05,          // 汇聚完成时刻
  GLYPH: [],           // 每个主体点的出发位置
  init(){
    const rnd = mulberry32(771);
    DOTS.forEach((d, i) => {
      if (d.dust) return;
      // 60% 从内核爆发，40% 从外围飘入
      if (rnd() < 0.6){
        const ang = rnd() * Math.PI * 2;
        const rad = 4 + rnd() * 46;
        d.sx = CX + Math.cos(ang) * rad;
        d.sy = CY + Math.sin(ang) * rad * 0.75;
      } else {
        const ang = rnd() * Math.PI * 2;
        const rad = 150 + rnd() * 170;
        d.sx = CX + Math.cos(ang) * rad;
        d.sy = CY + Math.sin(ang) * rad * 0.7;
      }
      // 弧线弯曲量
      d.bow = (rnd() * 2 - 1) * 26;
      d.delay = d.z * 0.30;
    });
  },
  draw(ctx, t){
    const g = ctx;
    g.fillStyle = '#050507';
    g.fillRect(0, 0, W, H);

    // 中心冷光（很淡，托住主体）
    const bg = g.createRadialGradient(CX, CY + 6, 10, CX, CY + 6, 250);
    bg.addColorStop(0, 'rgba(52,78,168,.16)');
    bg.addColorStop(0.5, 'rgba(30,44,96,.06)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // 浮尘
    g.globalCompositeOperation = 'lighter';
    DOTS.forEach(d => {
      if (!d.dust) return;
      const x = d.x + Math.sin(t * 0.5 + d.z * 9) * 6;
      const y = d.y - (t * 5) % 26 + Math.cos(t * 0.4 + d.z * 7) * 4;
      const a = d.a * (0.55 + 0.45 * Math.sin(t * 0.8 + d.z * 11)) * clamp01(t * 2);
      if (a <= 0) return;
      g.fillStyle = tint(d.x, 0.35, a);
      g.beginPath(); g.arc(x, y, d.r, 0, 6.2832); g.fill();
    });
    g.globalCompositeOperation = 'source-over';

    // 点火闪一下
    if (t < 0.30){
      const k = t / 0.30;
      const r = 2 + k * 26;
      const gg = g.createRadialGradient(CX, CY, 0, CX, CY, r);
      gg.addColorStop(0, `rgba(255,255,255,${(1-k)*0.9})`);
      gg.addColorStop(0.35, `rgba(150,190,255,${(1-k)*0.35})`);
      gg.addColorStop(1, 'rgba(80,120,255,0)');
      g.fillStyle = gg; g.beginPath(); g.arc(CX, CY, r, 0, 6.2832); g.fill();
    }

    // 主体粒子
    g.globalCompositeOperation = 'lighter';
    DOTS.forEach(d => {
      if (d.dust) return;
      const p = clamp01((t - d.delay) / (S1.CONV - d.delay));
      if (p <= 0) return;
      const e = easeOutQuart(p);
      const bow = Math.sin(p * Math.PI) * d.bow;
      const x = d.sx + (d.x - d.sx) * e + bow;
      const y = d.sy + (d.y - d.sy) * e + bow * 0.5;
      const a = Math.min(1, Math.pow(p, 1.55) * 1.35) * (d.a * 0.55 + 0.45);
      const r = d.r * (0.30 + e * 0.90);
      g.fillStyle = tint(d.x, d.rim ? 0.26 : 0.52, a);
      g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();

      // 落位后的高光核（让点阵有"发光"而不是"画上去"）
      if (p > 0.96 && d.rim){
        g.fillStyle = `rgba(255,255,255,${0.22 * a})`;
        g.beginPath(); g.arc(x, y, r * 0.34, 0, 6.2832); g.fill();
      }
    });
    g.globalCompositeOperation = 'source-over';

    // 光晕：成形后淡入，带呼吸
    const glow = clamp01((t - 0.72) / 0.55);
    if (glow > 0){
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = glow * (0.62 + 0.20 * Math.sin(t * 1.5));
      g.drawImage(GLOW, 0, 0, W, H);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }

    S1.text(g, t);
  },
  text(g, t){
    // 中文标题：逐字上浮 + 字距收紧
    const chars = ['无','限','画','布'];
    const fs = 18, fw = 500;
    g.font = `${fw} ${fs}px "Microsoft YaHei UI","Microsoft YaHei",sans-serif`;
    g.textBaseline = 'alphabetic';
    const startT = 0.80;
    // 先按目标字距排版
    const track = 1 + 0.10 * (1 - clamp01((t - startT) / 0.85));
    const widths = chars.map(c => g.measureText(c).width);
    const total = widths.reduce((a,b)=>a+b,0) + track * (chars.length - 1);
    let x = CX - total / 2;
    chars.forEach((c, i) => {
      const p = clamp01((t - startT - i * 0.075) / 0.42);
      if (p <= 0) return;
      const e = easeOutCubic(p);
      g.fillStyle = `rgba(238,241,247,${e})`;
      g.fillText(c, x, 216 + (1 - e) * 9);
      x += widths[i] + track;
    });

    // 英文 + 版本：等宽，宽字距
    const p2 = clamp01((t - 1.10) / 0.5);
    if (p2 > 0){
      g.font = `400 8px ui-monospace,"Cascadia Mono",Consolas,monospace`;
      g.fillStyle = `rgba(122,131,152,${easeOutCubic(p2) * 0.95})`;
      g.textAlign = 'center';
      const txt = 'I N F I N I T E   C A N V A S';
      g.fillText(txt, CX, 236);
      g.textAlign = 'left';
    }

    // 底部流光进度：不说百分比，只表示"在动"
    const p3 = clamp01((t - 0.35) / 0.5);
    if (p3 > 0){
      const y = 268, wline = 196, x0 = CX - wline/2;
      g.fillStyle = `rgba(255,255,255,${0.055 * p3})`;
      g.fillRect(x0, y, wline, 1);
      // 滑块：2.6s 一循环，来回
      const cyc = 2.6;
      const ph = (t % cyc) / cyc;
      const tri = ph < .5 ? ph*2 : 2-ph*2;
      const seg = 26 + 16 * Math.sin(t * 1.1);
      const sx = x0 + tri * (wline - seg);
      const grd = g.createLinearGradient(sx, 0, sx + seg, 0);
      grd.addColorStop(0, 'rgba(90,130,255,0)');
      grd.addColorStop(.5, `rgba(150,180,255,${0.62 * p3})`);
      grd.addColorStop(1, 'rgba(90,130,255,0)');
      g.fillStyle = grd;
      g.fillRect(sx, y - 0.5, seg, 2);
    }
  }
};
S1.init();

/* ==================================================================
   S2 · 网格显影 —— 仪器 / 示波器
   ================================================================== */
const S2 = {
  GRID_LINE: 32,        // 可见网格线（疏，作视觉参考）
  GRID_DOT: 8,          // 点阵（密，用来显形）
  cells: [],
  init(){
    const step = this.GRID_DOT;
    // 预计算每个网格交点到曲线的最近距离
    const curve = [];
    for (let i = 0; i < 320; i++){
      curve.push(lemniscate(i / 320 * Math.PI * 2));
    }
    for (let y = step / 2; y < H; y += step){
      for (let x = step / 2; x < W; x += step){
        const dx = x - CX, dy = (y - CY) / YS;
        const radial = Math.hypot(dx, dy);
        // 远处的点只当背景，不必求最近距离（320 次内循环 × 2400 格会明显卡）
        let dist = 999;
        if (radial < AA * 1.28){
          let best = 1e9;
          for (const [px, py] of curve){
            const d = (dx-px)*(dx-px) + (dy-py)*(dy-py);
            if (d < best) best = d;
          }
          dist = Math.sqrt(best);
        }
        const inner = insideShape(dx, dy);
        this.cells.push({
          x, y,
          dist,
          inGlyph: dist < 6 || inner,
          edge: dist >= 6 && dist < 11 && !inner,
          d: radial
        });
      }
    }
  },
  draw(ctx, t){
    const g = ctx;
    g.fillStyle = '#050508'; g.fillRect(0, 0, W, H);

    const bg = g.createRadialGradient(CX, CY, 8, CX, CY, 260);
    bg.addColorStop(0, 'rgba(38,58,120,.13)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // 网格线
    const step = this.GRID_LINE;
    g.strokeStyle = 'rgba(120,150,220,.055)';
    g.lineWidth = 1;
    g.beginPath();
    for (let x = step; x < W; x += step){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
    for (let y = step; y < H; y += step){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
    g.stroke();

    // 波前扫描（雷达式）
    const wave = t * 300;
    g.globalCompositeOperation = 'lighter';
    this.cells.forEach(c => {
      const dd = Math.abs(c.d - wave);
      const ring = Math.max(0, 1 - dd / 46);
      let a = 0;

      // 网格点常驻微光
      a += 0.055;
      // 波前增益
      a += ring * ring * 0.85;

      // 显影：t>0.9 后形状内的点固化为彩色
      const solid = clamp01((t - 0.85) / 0.9);
      if (c.inGlyph) a += solid * 0.66;
      else if (c.edge) a += solid * 0.26;

      if (a < 0.02) return;
      g.fillStyle = c.inGlyph ? tint(c.x, 0.26, Math.min(1, a))
                              : `rgba(148,168,214,${Math.min(1, a)})`;
      const r = c.inGlyph ? 1.05 + ring * 1.4 : 0.6 + ring * 1.5;
      g.beginPath(); g.arc(c.x, c.y, r, 0, 6.2832); g.fill();
    });
    g.globalCompositeOperation = 'source-over';

    // 中心准星
    const cross = clamp01((t - 0.15) / 0.5) * (1 - clamp01((t - 1.5) / 0.6));
    if (cross > 0){
      g.strokeStyle = `rgba(140,170,235,${cross * 0.45})`;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(CX - 4, CY + .5); g.lineTo(CX + 4, CY + .5);
      g.moveTo(CX + .5, CY - 4); g.lineTo(CX + .5, CY + 4);
      g.stroke();
    }

    // 四角读数
    const p = clamp01(t / 0.35);
    g.font = '400 8px ui-monospace,"Cascadia Mono",Consolas,monospace';
    g.fillStyle = `rgba(110,124,150,${0.8 * p})`;
    g.fillText('SNC://BOOT', 16, 22);
    g.fillText('SHAPE 0x2B · LEMNISCATE', 16, 34);
    const hex = Math.floor(t * 420).toString(16).toUpperCase().padStart(6, '0');
    g.textAlign = 'right';
    g.fillText('0x' + hex, W - 16, 22);
    g.fillText('PARTICLE ' + DOTS.length, W - 16, 34);
    g.textAlign = 'left';

    S2.text(g, t);
  },
  text(g, t){
    const p = clamp01((t - 0.95) / 0.55);
    if (p <= 0) return;
    const e = easeOutCubic(p);
    g.textAlign = 'center';
    g.font = `400 13px "Microsoft YaHei UI","Microsoft YaHei",sans-serif`;
    g.fillStyle = `rgba(232,236,244,${e})`;
    g.fillText('无限画布', CX, 216);
    g.font = '400 7.5px ui-monospace,"Cascadia Mono",Consolas,monospace';
    g.fillStyle = `rgba(110,124,150,${e * 0.9})`;
    g.fillText('L O C A L   R E N D E R   ·   v3.8.2', CX, 236);
    g.textAlign = 'left';

    // 底部刻度进度：一排小格，逐格点亮
    const y = 268, n = 32, gap = 3, bw = 3.4;
    const total = n * bw + (n-1) * gap;
    const x0 = CX - total / 2;
    const lit = Math.floor((t % 2.2) / 2.2 * (n + 6));
    for (let i = 0; i < n; i++){
      const on = i < lit && i < n;
      g.fillStyle = on ? 'rgba(140,170,240,.75)' : 'rgba(255,255,255,.07)';
      g.fillRect(x0 + i * (bw + gap), y, bw, 2);
    }
  }
};
S2.init();

/* ==================================================================
   S3 · 光体扫描 —— 一条光带自下而上把形体"照亮"
   ================================================================== */
const S3 = {
  SCAN0: 0.45, SCAN1: 2.05,
  draw(ctx, t){
    const g = ctx;
    g.fillStyle = '#040406'; g.fillRect(0, 0, W, H);

    const bg = g.createRadialGradient(CX, CY, 6, CX, CY, 250);
    bg.addColorStop(0, 'rgba(40,52,110,.10)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // 扫描位置：从底部之上进入，扫到顶部之外
    const sp = clamp01((t - this.SCAN0) / (this.SCAN1 - this.SCAN0));
    const scanY = H + 70 - sp * (H + 150);
    const started = t > this.SCAN0;

    // 尘埃：缓慢上浮
    g.globalCompositeOperation = 'lighter';
    DOTS.forEach(d => {
      if (!d.dust) return;
      const y = (d.y - t * 7 + 400) % 400 - 50;
      const a = d.a * 0.75 * clamp01(t * 1.5);
      g.fillStyle = tint(d.x, 0.40, a * 0.8);
      g.beginPath(); g.arc(d.x, y, d.r, 0, 6.2832); g.fill();
    });

    // 主体：扫到的点被点亮并固化
    DOTS.forEach(d => {
      if (d.dust) return;
      // 颜色按形体自身的高度映射：底部蓝 → 顶部橙（与参考视频同向）
      const v = clamp01((CY + 40 - d.y) / 80);
      // 静止微光（几乎不可见，让形状先"存在"）
      let a = 0.055;
      let boost = 0;

      if (started){
        // 已被扫过：常亮
        if (d.y > scanY){
          const since = (d.y - scanY) / 260;                 // 越过多久
          const settle = clamp01(since * 2.2);
          a = 0.055 + settle * (0.62 * d.a + 0.30);
        }
        // 正在光带内：额外爆亮
        const dy = Math.abs(d.y - scanY);
        if (dy < 46){
          boost = Math.pow(1 - dy / 46, 2) * 1.15;
          a += boost;
        }
      }

      g.fillStyle = tintAt(v, d.rim ? 0.24 : 0.50, Math.min(1, a));
      const r = d.r * (1 + boost * 0.9);
      g.beginPath(); g.arc(d.x, d.y, r, 0, 6.2832); g.fill();

      if (a > 0.75){
        g.fillStyle = `rgba(255,255,255,${(a - 0.75) * 0.6})`;
        g.beginPath(); g.arc(d.x, d.y, r * 0.4, 0, 6.2832); g.fill();
      }
    });

    // 扫描带余辉
    if (started && sp < 1.02){
      const hz = 54;
      const grd = g.createLinearGradient(0, scanY - hz, 0, scanY + 2);
      grd.addColorStop(0, 'rgba(90,150,255,0)');
      grd.addColorStop(0.82, 'rgba(120,180,255,.10)');
      grd.addColorStop(1, 'rgba(190,220,255,.30)');
      g.fillStyle = grd;
      g.fillRect(0, scanY - hz, W, hz + 2);
      g.fillStyle = 'rgba(210,232,255,.55)';
      g.fillRect(0, scanY, W, 1);
    }
    g.globalCompositeOperation = 'source-over';

    // 文字：扫描过半后浮出
    const p = clamp01((t - 1.35) / 0.6);
    if (p > 0){
      const e = easeOutCubic(p);
      g.textAlign = 'center';
      g.font = `300 17px "Microsoft YaHei UI","Microsoft YaHei",sans-serif`;
      g.fillStyle = `rgba(240,243,250,${e})`;
      g.fillText('无限画布', CX, 216);
      g.font = '400 7.5px ui-monospace,"Cascadia Mono",Consolas,monospace';
      g.fillStyle = `rgba(112,124,148,${e * 0.9})`;
      g.fillText('S C A N N I N G   C A N V A S', CX, 236);
      g.textAlign = 'left';
    }

    // 底部细线 + 扫描同步的光点
    const y = 268, wl = 196, x0 = CX - wl/2;
    g.fillStyle = 'rgba(255,255,255,.05)';
    g.fillRect(x0, y, wl, 1);
    if (started){
      const px = x0 + clamp01(sp) * wl;
      const grd = g.createLinearGradient(px - 70, 0, px, 0);
      grd.addColorStop(0, 'rgba(120,170,255,0)');
      grd.addColorStop(1, 'rgba(190,220,255,.8)');
      g.fillStyle = grd;
      g.fillRect(Math.max(x0, px - 70), y - 0.5, Math.min(70, px - x0), 2);
    }
  }
};

/* ==================================================================
   渲染器
   ================================================================== */
// 必须用箭头包一层：直接取方法引用会让 this 变成 window，
// S2.cells / S3.SCAN0 就全丢了（第一版就是这么翻的）
const DRAW = {
  s1: (c, t) => S1.draw(c, t),
  s2: (c, t) => S2.draw(c, t),
  s3: (c, t) => S3.draw(c, t),
};

const META = {
  s1: {
    name: 'S1 · 点阵聚形', tag: '参考 Antigravity',
    lead: '一万多个光点先在黑暗里点亮内核，再沿弧线飞向各自的坐标，拼出 ∞。落位后光晕浮起，色彩沿形状横向铺开：左蓝、中青、右橙。',
    kv: [['成形时长','1.05 s'],['粒子数','2 370'],['光源','内核爆发 + 外围飘入'],['色带','蓝→青→绿→金→橙'],['收尾','光晕呼吸 1.5 Hz']],
    note: '最贴你发的那段。工程上它也是三套里最"重"的：需要逐帧往位图上写像素，现有 GDI 画不了，得换 DIB Section。'
  },
  s2: {
    name: 'S2 · 网格显影', tag: '仪器 / 示波器',
    lead: '先铺一层几乎看不见的坐标网格，一道环形波从中心扩散，扫过的交点依次亮起；形状所在的交点固化成彩色，其余回落成暗点。',
    kv: [['成形时长','1.75 s'],['网格','8 px 点阵 / 32 px 线'],['波速','300 px/s'],['读数','等宽 · 实时 hex'],['收尾','刻度逐格点亮']],
    note: '最"专业工具"的一套，和左栏那 21 个技能列表的气质一致。它不需要模糊，纯点绘制，GDI 落地最省力。'
  },
  s3: {
    name: 'S3 · 光体扫描', tag: '体积光 / 扫描线',
    lead: '形体先在黑暗中以极低亮度存在，一条水平光带自下而上扫过，扫到哪里哪里被点亮并留下余辉，颜色按高度从蓝过渡到橙。',
    kv: [['扫描时长','1.6 s'],['光带','54 px 渐变'],['余辉','按越过时间固化'],['色彩轴','高度映射'],['收尾','定格呼吸']],
    note: '最有"体积感"，也最克制——只有一条线在动。缺点是"扫描"这个语义更像扫描仪/雷达，不像"画布"。'
  }
};
const ORDER = ['s1','s2','s3'];

const deck = document.getElementById('deck');
let mode = 's1';
let t0 = performance.now();
let paused = false;
const canvases = [];

function makeShot(key){
  const wrap = document.createElement('div');
  wrap.className = 'shot';
  const cv = document.createElement('canvas');
  cv.width = W * 2; cv.height = H * 2;
  cv.style.aspectRatio = `${W} / ${H}`;
  wrap.appendChild(cv);
  canvases.push({ cv, ctx: cv.getContext('2d'), key });
  return wrap;
}

function build(){
  deck.innerHTML = '';
  canvases.length = 0;
  const oldCmp = document.getElementById('cmp');
  if (oldCmp) oldCmp.remove();
  deck.className = 'deck' + (mode === 'all' ? '' : ' one');
  const list = mode === 'all' ? ORDER : [mode];

  list.forEach(k => {
    const m = META[k];
    const col = document.createElement('section');
    col.className = 'col';

    const hd = document.createElement('div');
    hd.className = 'col-hd';
    hd.innerHTML = `<span class="num">${k.toUpperCase()}</span><h2>${m.name.split('· ')[1]}</h2>
      <span class="tag">${m.tag}</span>
      <span class="exp">${mode === 'all' ? '点击看大图 →' : '← 返回并排'}</span>`;
    hd.onclick = () => { mode = (mode === 'all' ? k : 'all'); syncSeg(); build(); };
    col.appendChild(hd);

    col.appendChild(makeShot(k));

    if (mode === 'all'){
      const p = document.createElement('p');
      p.className = 'col-note';
      p.innerHTML = `<b>${m.kv[0][1]}</b> 成形 · ${m.tag}`;
      col.appendChild(p);
    }
    deck.appendChild(col);

    if (mode !== 'all'){
      const side = document.createElement('aside');
      side.className = 'side';
      side.innerHTML = `<h3>${m.name}</h3>
        <p class="lead">${m.lead}</p>
        <ul>${m.kv.map(([a,b]) => `<li><i>${a}</i><em>${b}</em></li>`).join('')}</ul>
        <div class="hint">${m.note}</div>`;
      deck.appendChild(side);
    }
  });

  if (mode === 'all'){
    const box = document.createElement('div');
    box.className = 'cmp';
    box.id = 'cmp';
    ORDER.forEach(k => {
      const m = META[k];
      const s = document.createElement('section');
      s.innerHTML = `<h4><i>${k.toUpperCase()}</i>${m.name.split('· ')[1]}
        <span style="margin-left:auto;font-weight:400;color:#5a5a63;font-size:10px">${m.tag}</span></h4>
        <dl>${m.kv.map(([a,b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
        <div class="cost"><b>落地</b> · ${k === 's1'
          ? '需换 DIB Section 逐像素渲染，约 180 行 Win32'
          : k === 's2' ? '纯点绘制，现有 GDI 加 40 行即可'
          : '一次渐变填充 + 点绘制，约 70 行'}</div>`;
      box.appendChild(s);
    });
    deck.parentElement.appendChild(box);
  }
  t0 = performance.now();
}

function frame(now){
  if (paused) return;
  const t = (now - t0) / 1000;
  canvases.forEach(({ ctx, key }) => {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.save();
    DRAW[key](ctx, t);
    ctx.restore();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 定格接口：截图用，也让"关键帧"可复现 */
window.sncSeek = function(t){
  paused = true;
  canvases.forEach(({ ctx, key }) => {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.save();
    DRAW[key](ctx, t);
    ctx.restore();
  });
};
window.sncPlay = function(){ paused = false; t0 = performance.now(); requestAnimationFrame(frame); };

function syncSeg(){
  document.querySelectorAll('#modeSeg button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
}
document.getElementById('modeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; syncSeg(); build();
};
document.getElementById('replay').onclick = () => { paused = false; t0 = performance.now(); };

syncSeg(); build();
</script>
</body>
</html>
