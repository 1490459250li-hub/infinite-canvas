<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启动动画 · 真实 logo 三方案</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --bg:#08080a; --panel:#0e0e12; --line:#1e1e26; --line2:#2a2a34;
    --ink:#e9e7e2; --ink2:#a9a6a0; --ink3:#6f6c66;
    --orange:#e4683e;
  }
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); min-height:100%;
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; padding:22px 26px 34px;
  }
  header{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
  .ttl{display:flex; flex-direction:column; gap:4px;}
  .ttl b{font-size:14px; font-weight:600; letter-spacing:-.01em;}
  .ttl span{font-size:11.5px; color:var(--ink3); line-height:1.5;}
  .seg{display:flex; gap:2px; background:#121216; border:1px solid var(--line); border-radius:9px; padding:2px;}
  .seg button{
    border:0; background:transparent; color:var(--ink3); cursor:pointer;
    font:inherit; font-size:11.5px; padding:5px 11px; border-radius:7px; white-space:nowrap;
    transition:background .14s, color .14s;
  }
  .seg button:hover{color:var(--ink2);}
  .seg button.on{background:#232329; color:var(--ink);}
  .grow{flex:1;}

  main{display:grid; grid-template-columns:520px 300px; gap:24px; align-items:start;}

  .frame{
    position:relative; width:520px; height:300px; border-radius:12px; overflow:hidden;
    background:#000; box-shadow:0 0 0 1px #232329, 0 30px 70px -40px #000;
  }
  #cv{display:block; width:520px; height:300px;}
  .hud{
    position:absolute; left:0; right:0; bottom:0; height:26px; display:flex;
    align-items:center; gap:10px; padding:0 12px; font-size:10px; color:#4a4a55;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; pointer-events:none;
  }
  .hud i{flex:1; height:1px; background:#1c1c22; position:relative; overflow:hidden;}
  .hud i::after{content:""; position:absolute; left:0; top:0; height:1px; width:var(--p,0%);
    background:linear-gradient(90deg, transparent, #7d92d8, transparent);}

  aside{display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px 15px 16px;}
  .card h2{font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .card .tag{font-size:10px; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase;}
  .card p{font-size:11.5px; line-height:1.68; color:var(--ink2); margin-top:9px;}
  .kv{display:flex; flex-direction:column; gap:0; margin-top:12px;}
  .kv div{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid #17171d; font-size:11px;}
  .kv div:first-child{border-top:0;}
  .kv i{color:var(--ink3); font-style:normal;}
  .kv em{font-style:normal; color:var(--ink2); font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:10.5px;}
  .note{font-size:11px; line-height:1.65; color:#7a776f; border-left:2px solid var(--line2); padding-left:10px;}

  .strip{display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;}
  .thumb{display:flex; flex-direction:column; gap:7px; cursor:pointer;}
  .thumb canvas{width:260px; height:150px; display:block; border-radius:8px; box-shadow:0 0 0 1px #1c1c22;}
  .thumb b{font-size:11px; font-weight:500; color:var(--ink3);}
  .thumb.on b{color:var(--ink);}
</style>
</head>
<body>

<header>
  <div class="ttl">
    <b>启动动画 · 用真实 logo 重做点阵聚形</b>
    <span>三个方案共享同一套粒子内核（点位与颜色逐像素采自 app.ico）；差异在「怎么聚」</span>
  </div>
  <div class="grow"></div>
  <div class="seg" id="seg">
    <button data-m="p1" class="on">P1 静燃</button>
    <button data-m="p2">P2 描边先行</button>
    <button data-m="p3">P3 双层合拢</button>
  </div>
  <div class="seg">
    <button id="replay">重播</button>
    <button id="loop" class="on">循环</button>
  </div>
</header>

<main>
  <div>
    <div class="frame">
      <canvas id="cv"></canvas>
      <div class="hud"><span id="clock">0.00s</span><i></i><span>520 × 300</span></div>
    </div>
    <div class="strip" id="strip"></div>
  </div>

  <aside>
    <div class="card">
      <span class="tag">当前方案</span>
      <h2 id="name">P1 · 静燃</h2>
      <p id="lead"></p>
      <div class="kv" id="kv"></div>
    </div>
    <div class="card">
      <span class="tag">实现要点</span>
      <p id="impl"></p>
      <div class="note" id="note"></div>
    </div>
  </aside>
</main>

<script>
/* ============================================================
   真实 logo 采样
   —— 逐像素读 app.ico 导出的 256×256 PNG，取点位的颜色与透明度
   ============================================================ */
const W = 520, H = 300;
const LOGO_PX = 172;                   // logo 在启动窗里的显示边长
const CY_SHIFT = -14;                  // 整体上移，给文字留位置

const cv = document.getElementById('cv');
const DPR = 2;
cv.width = W * DPR; cv.height = H * DPR;
let ctx = cv.getContext('2d');
ctx.scale(DPR, DPR);

let DOTS = [];
let GLOW = null;                        // 预渲染的橙色辉光
let IMG = null;
let ready = false;

const SRC = 256;
const STEP = 4;                         // 源图采样步长（4px → 约 3000 点）

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const smoothstep = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };

const img = new Image();
img.src = 'img/logo_256.png';
img.onload = () => { IMG = img; buildDots(); };

function buildDots(){
  const off = document.createElement('canvas');
  off.width = SRC; off.height = SRC;
  const oc = off.getContext('2d', { willReadFrequently: true });
  oc.drawImage(img, 0, 0, SRC, SRC);
  const data = oc.getImageData(0, 0, SRC, SRC).data;

  const at = (x, y) => (x < 0 || y < 0 || x >= SRC || y >= SRC) ? 0 : data[((y * SRC + x) << 2) + 3];

  const rnd = mulberry32(20261121);
  const scale = LOGO_PX / SRC;
  const cx = W / 2, cy = H / 2 + CY_SHIFT;
  const list = [];

  for (let y = 0; y < SRC; y += STEP){
    for (let x = 0; x < SRC; x += STEP){
      // 块内取 alpha 最大的像素作为代表，避免细线被漏掉
      let best = 0, bx = x, by = y;
      for (let j = 0; j < STEP; j++){
        for (let i = 0; i < STEP; i++){
          const a = at(x + i, y + j);
          if (a > best){ best = a; bx = x + i; by = y + j; }
        }
      }
      if (best < 60) continue;

      const p = ((by * SRC + bx) << 2);
      const r = data[p], g = data[p + 1], b = data[p + 2];

      // 边缘判定：四邻域里有透明像素 → 轮廓点
      const edge =
        at(bx - STEP, by) < 60 || at(bx + STEP, by) < 60 ||
        at(bx, by - STEP) < 60 || at(bx, by + STEP) < 60;

      // 橙色（底 + 折线）与白色（卡片）分开，供 P3 分两波
      const mx = Math.min(r, g, b), mn = Math.max(r, g, b);
      const sat = mn === 0 ? 0 : (mn - mx) / mn;
      const isWhite = sat < 0.22 && mn > 170;
      const isOrange = !isWhite;

      // 相对 logo 中心的极坐标，用于「从外向内收」的方向
      const tx = bx * scale, ty = by * scale;
      const dx = tx - LOGO_PX / 2, dy = ty - LOGO_PX / 2;
      const dist = Math.hypot(dx, dy) || 1;
      const ang = Math.atan2(dy, dx);

      list.push({
        gx: cx - LOGO_PX / 2 + tx,           // 目标坐标（画布绝对）
        gy: cy - LOGO_PX / 2 + ty,
        r, g, b,
        alpha: best / 255,
        rr: 0.75 + rnd() * 0.55,             // 点半径
        edge, isWhite, isOrange,
        ux: dx / dist, uy: dy / dist,        // 向外单位向量
        ang,
        z: rnd(),
        // 螺旋聚拢的排序：角度为主，混一点随机
        rank: (ang + Math.PI) / (Math.PI * 2) * 0.72 + rnd() * 0.28
      });
    }
  }
  DOTS = list;

  buildGlow();
  ready = true;
  t0 = performance.now();
}

/* 橙色辉光：把 logo 剪影染色后整块模糊，运行时只做一次 drawImage */
function buildGlow(){
  const tinted = document.createElement('canvas');
  tinted.width = SRC; tinted.height = SRC;
  const tc = tinted.getContext('2d');
  tc.drawImage(img, 0, 0, SRC, SRC);
  tc.globalCompositeOperation = 'source-in';
  tc.fillStyle = '#e4683e';
  tc.fillRect(0, 0, SRC, SRC);

  const gcv = document.createElement('canvas');
  gcv.width = W * DPR; gcv.height = H * DPR;
  const gc = gcv.getContext('2d');
  gc.scale(DPR, DPR);
  gc.filter = 'blur(26px)';
  gc.globalAlpha = 0.95;
  gc.drawImage(tinted,
    W / 2 - LOGO_PX / 2, H / 2 + CY_SHIFT - LOGO_PX / 2, LOGO_PX, LOGO_PX);
  // 第二层：更小更实，制造"灯芯"
  gc.filter = 'blur(10px)';
  gc.globalAlpha = 0.6;
  gc.drawImage(tinted,
    W / 2 - LOGO_PX / 2, H / 2 + CY_SHIFT - LOGO_PX / 2, LOGO_PX, LOGO_PX);

  GLOW = gcv;
}

/* ============================================================
   三个方案的绘制
   ============================================================ */
const MODES = {
  p1: {
    name: 'P1 · 静燃',
    lead: '粒子从四周的尘埃位置向各自坐标收拢，落位后 logo 的橙色辉光从底部浮起，以 1.5 Hz 缓慢呼吸。最克制的一套，和方案 A 的「静默精密」同一语气。',
    impl: '单波次聚拢：延迟沿极角展开（0.10–0.80s），形成轻微的螺旋；辉光用预渲染的橙色剪影 + blur 26，运行时零开销。',
    note: '风险最低。若只想要"安静的科技感"，选它。',
    kv: [['成形时长','1.15 s'],['粒子数','—'],['起点','径向 60–200px 外'],['辉光','橙 · 26px'],['收尾','1.5 Hz 呼吸']]
  },
  p2: {
    name: 'P2 · 描边先行',
    lead: '轮廓点先落位，把 logo 的边缘先"勾"出来；随后内部点填充成面。收尾一道竖向光带从左扫到右，扫过处短暂提亮。像一支笔把标识画出来。',
    impl: '轮廓与内部用两个延迟区间（0–0.75s / 0.35–1.25s）；扫光是一条 x 上的高斯带，1.55–2.35s 走完全宽，只作用于落位后的点。',
    note: '和"画布 / 绘制"的产品语义最贴合，但收尾多了 0.8s，总时长比 P1 长。',
    kv: [['成形时长','1.25 s'],['轮廓波','0.00–0.75 s'],['填充波','0.35–1.25 s'],['扫光','1.55–2.35 s'],['收尾','高光回落']]
  },
  p3: {
    name: 'P3 · 双层合拢',
    lead: '橙色底与白色卡片分成两波：橙点自下而上浮入，白点自上而下落下，在中线合拢成完整的叠层标识。把 logo 本身的"三层卡片"讲成了动作。',
    impl: '按采样颜色的饱和度分流（白卡 sat<0.22 且亮度>170）。橙波 0.10–0.95s 自 +y 方向进入，白波 0.42–1.30s 自 −y 方向进入。',
    note: '最有品牌叙事性。代价是两波错位期间画面偏"空"，快机器上一闪而过。',
    kv: [['成形时长','1.30 s'],['橙波','自下 · 0.10 s'],['白波','自上 · 0.42 s'],['错位','320 ms'],['收尾','辉光渐起']]
  }
};

let mode = 'p1';
let t0 = performance.now();
let looping = true;

function drawP1(t){
  const glowAmt = smoothstep(0.75, 1.9, t) * (1 + 0.13 * Math.sin((t - 1.9) * 9.4));
  if (t > 1.9) blendGlow(glowAmt);

  for (const d of DOTS){
    const delay = 0.10 + d.rank * 0.70 + d.z * 0.12;
    const p = clamp01((t - delay) / 0.46);
    if (p <= 0) continue;
    const e = easeOutCubic(p);
    const out = 60 + d.z * 150;                       // 起始距离
    const x = d.gx + d.ux * out * (1 - e);
    const y = d.gy + d.uy * out * (1 - e);
    particle(d, x, y, e, p);
  }
}

function drawP2(t){
  const glowAmt = smoothstep(1.25, 2.3, t);
  if (t > 1.25) blendGlow(glowAmt);

  // 扫光位置
  const sweep = t < 1.55 ? -1 : (t - 1.55) / 0.8 * 1.35 - 0.18;
  const sweepX = sweep < 0 ? -1e3 : W * sweep;

  for (const d of DOTS){
    const isEdge = d.edge;
    const delay = isEdge ? (0.02 + d.rank * 0.70) : (0.36 + d.rank * 0.86);
    const dur = isEdge ? 0.40 : 0.46;
    const p = clamp01((t - delay) / dur);
    if (p <= 0) continue;
    const e = easeOutCubic(p);
    // 轮廓点沿法线外侧短距离切入，内部点从更远处的径向进入
    const out = isEdge ? 26 + d.z * 42 : 90 + d.z * 170;
    const x = d.gx + d.ux * out * (1 - e);
    const y = d.gy + d.uy * out * (1 - e);

    // 扫光：距光带越近越亮
    let boost = 0;
    if (sweepX > -1){
      const dxs = Math.abs(d.gx - sweepX);
      boost = Math.exp(-(dxs * dxs) / (2 * 34 * 34)) * 0.85 * (1 - clamp01((t - 2.0) / 0.55));
    }
    particle(d, x, y, e, p, boost);
  }
}

function drawP3(t){
  const glowAmt = smoothstep(0.95, 2.1, t);
  if (t > 0.95) blendGlow(glowAmt);

  for (const d of DOTS){
    const white = d.isWhite;
    const delay = white ? (0.42 + d.rank * 0.62 + d.z * 0.10)
                        : (0.10 + d.rank * 0.62 + d.z * 0.10);
    const p = clamp01((t - delay) / 0.48);
    if (p <= 0) continue;
    const e = easeOutCubic(p);
    // 橙点自下、白点自上
    const out = 70 + d.z * 150;
    const x = d.gx + d.ux * out * 0.34 * (1 - e) + (d.z - 0.5) * 8 * (1 - e);
    const y = d.gy + (white ? -1 : 1) * out * (1 - e);
    particle(d, x, y, e, p);
  }
}

/* 单个粒子 */
function particle(d, x, y, e, p, boost){
  // 白点压一档亮度：否则在深色底上会过曝
  const baseA = d.isWhite ? 0.62 : 0.86;
  let a = d.alpha * baseA * Math.pow(p, 0.55);
  a = Math.min(1, a + (boost || 0));
  if (a < 0.015) return;

  const r = d.rr * (0.45 + e * 0.62);
  ctx.fillStyle = `rgba(${d.r},${d.g},${d.b},${a})`;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 6.2832);
  ctx.fill();

  // 落位后的一次高光：让点"点亮"而不是"画上去"
  if (p > 0.965){
    const k = (p - 0.965) / 0.035;
    ctx.fillStyle = `rgba(255,255,255,${0.30 * (1 - k) * (1 - k) * (d.isWhite ? 0.5 : 1)})`;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.5, 0, 6.2832);
    ctx.fill();
  }
}

function blendGlow(amt){
  if (!GLOW || amt <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, amt) * 0.85;
  ctx.drawImage(GLOW, 0, 0, W, H);
  ctx.restore();
}

/* 文字层 */
function drawText(t){
  const chars = ['无', '限', '画', '布'];
  const fs = 18;
  ctx.font = `500 ${fs}px "Microsoft YaHei UI","Microsoft YaHei",sans-serif`;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  const startT = 1.05;
  const track = 1 + 0.10 * (1 - clamp01((t - startT) / 0.8));
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  let x = W / 2 - total / 2;
  chars.forEach((c, i) => {
    const p = clamp01((t - startT - i * 0.07) / 0.42);
    if (p <= 0) return;
    const e = easeOutCubic(p);
    ctx.fillStyle = `rgba(238,241,247,${e * 0.94})`;
    ctx.fillText(c, x, 236 + (1 - e) * 8);
    x += widths[i] + track;
  });

  const p2 = clamp01((t - 1.32) / 0.5);
  if (p2 > 0){
    ctx.font = '400 8px ui-monospace,"Cascadia Mono",Consolas,monospace';
    ctx.fillStyle = `rgba(120,116,108,${easeOutCubic(p2) * 0.95})`;
    ctx.textAlign = 'center';
    ctx.fillText('I N F I N I T E   C A N V A S', W / 2, 254);
    ctx.textAlign = 'left';
  }

  // 底部进度：一条细线 + 一段慢速流光，不报百分比
  const p3 = clamp01((t - 0.25) / 0.5);
  if (p3 > 0){
    const y = 278, wl = 186, x0 = W / 2 - wl / 2;
    ctx.fillStyle = `rgba(255,255,255,${0.055 * p3})`;
    ctx.fillRect(x0, y, wl, 1);

    const phase = (t * 0.55) % 1;
    const seg = 52;
    const sx = x0 + phase * (wl - seg);
    const grd = ctx.createLinearGradient(sx, 0, sx + seg, 0);
    grd.addColorStop(0, 'rgba(228,104,62,0)');
    grd.addColorStop(0.5, `rgba(240,150,110,${0.9 * p3})`);
    grd.addColorStop(1, 'rgba(228,104,62,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(sx, y - 0.5, seg, 2);
  }
}

/* ============================================================
   主循环
   ============================================================ */
const TOTAL = { p1: 3.4, p2: 4.0, p3: 3.8 };

function loopFn(now){
  const t = paused ? frozenT : (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (ready){
    (mode === 'p1' ? drawP1 : mode === 'p2' ? drawP2 : drawP3)(t);
    drawText(t);
  }

  const dur = TOTAL[mode];
  document.getElementById('clock').textContent = t.toFixed(2) + 's';
  document.querySelector('.hud i').style.setProperty('--p', Math.min(100, t / dur * 100) + '%');

  if (t > dur + 0.6){
    if (looping){ t0 = now; }
    else if (!loopDone){ loopDone = true; renderThumbs(); }
  }
  requestAnimationFrame(loopFn);
}
let loopDone = false;
let paused = false, frozenT = 0;
window.__seek = t => { paused = true; frozenT = t; };
window.__resume = () => { paused = false; t0 = performance.now(); };
window.__ready = () => ready;
requestAnimationFrame(loopFn);

/* ============================================================
   缩略图：把三个方案各自的关键帧静态画出来
   ============================================================ */
function renderThumbs(){
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  ['p1', 'p2', 'p3'].forEach(m => {
    const box = document.createElement('div');
    box.className = 'thumb' + (m === mode ? ' on' : '');

    const c = document.createElement('canvas');
    c.width = 260 * DPR; c.height = 150 * DPR;
    const g2 = c.getContext('2d');
    g2.scale(DPR, DPR);
    g2.scale(260 / W, 150 / H);

    if (ready){
      const saved = ctx;
      ctx = g2;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const tt = m === 'p1' ? 2.35 : m === 'p2' ? 2.62 : 2.60;
      (m === 'p1' ? drawP1 : m === 'p2' ? drawP2 : drawP3)(tt);
      drawText(tt);
      ctx = saved;
    }

    const label = document.createElement('b');
    label.textContent = MODES[m].name;
    box.appendChild(c);
    box.appendChild(label);
    box.onclick = () => setMode(m);
    strip.appendChild(box);
  });
}

/* ============================================================
   交互
   ============================================================ */
function setMode(m){
  mode = m;
  t0 = performance.now();
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  const info = MODES[m];
  document.getElementById('name').textContent = info.name;
  document.getElementById('lead').textContent = info.lead;
  document.getElementById('impl').textContent = info.impl;
  document.getElementById('note').textContent = info.note;
  document.getElementById('kv').innerHTML = info.kv
    .map(([k, v]) => `<div><i>${k}</i><em>${v}</em></div>`).join('');
  renderThumbs();
}

document.querySelectorAll('#seg button').forEach(b => {
  b.onclick = () => setMode(b.dataset.m);
});
document.getElementById('replay').onclick = () => { t0 = performance.now(); };
document.getElementById('loop').onclick = (e) => {
  looping = !looping;
  e.currentTarget.classList.toggle('on', looping);
  if (looping) t0 = performance.now();
};

setMode('p1');
</script>
</body>
</html>
